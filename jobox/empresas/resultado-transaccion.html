<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Resultado de la Transacción</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7ff;
            color: #333;
        }

        .hero-single {
            position: relative;
            padding: 100px 20px;
            text-align: center;
            background-color: #fff;
            overflow: hidden;
        }

        .hero-info-content h6 {
            font-weight: 600;
            font-size: 20px;
        }

        .hero-info-content h6 span {
            color: #3C65F5;
            font-weight: 700;
        }

        .resultado-box {
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .success {
            color: #2ecc71;
        }

        .error {
            color: #e74c3c;
        }

        .hero-shape img {
            position: absolute;
            pointer-events: none;
            z-index: -1;
        }

        .hero-shape .hero-shape-1 {
            left: 0;
            bottom: 0;
            width: 200px;
            opacity: 0.3;
        }

        .hero-shape .hero-shape-2 {
            left: 40%;
            top: 20%;
            width: 100px;
            opacity: 0.2;
        }

        .hero-shape .hero-shape-3 {
            right: 10%;
            top: 20%;
            width: 50px;
            opacity: 0.2;
        }

        .hero-shape .hero-shape-4 {
            left: 22%;
            top: 0;
            width: 120px;
            opacity: 0.1;
        }
    </style>
</head>

<body>
    <section class="hero-single">
        <div class="hero-info-content">
            <h6>Estado de la <span>transacción</span></h6>
            <div class="resultado-box" id="resultado">
                Cargando información de la transacción...
            </div>
        </div>

        <div class="hero-shape">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f4b0.svg" class="hero-shape-1">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/2728.svg" class="hero-shape-2">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f4b3.svg" class="hero-shape-3">
            <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f4af.svg" class="hero-shape-4">
        </div>
    </section>
    

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token_ws");
        const box = document.getElementById("resultado");

        if (!token) {
            box.innerHTML = '<p class="error">Token inválido. No se puede mostrar la transacción.</p>';
        } else {
            fetch(`${BASE_URL_API}/webpay/detail?token_ws=${token}`)
                .then(res => res.json())
                .then(data => {
                    const tx = data.response_data;
                    const date = new Date(tx.transaction_date).toLocaleString("es-CL");

                    if (data.status === "AUTHORIZED") {
                        box.innerHTML = `
                            <p class="success"><strong>¡Pago exitoso!</strong></p>
                            <p><strong>Número de orden de pedido:</strong> ${tx.buy_order}</p>
                            <p><strong>Nombre del comercio:</strong> Comercio XYZ</p>
                            <p><strong>Monto:</strong> $${tx.amount} CLP</p>
                            <p><strong>Código de autorización:</strong> ${tx.authorization_code}</p>
                            <p><strong>Fecha de la transacción:</strong> ${date}</p>
                            <p><strong>Tipo de pago:</strong> ${tx.payment_type_code === 'VD' ? 'Débito' : 'Crédito'}</p>
                            <p><strong>Cantidad de cuotas:</strong> ${tx.installments_number > 0 ? tx.installments_number : 'Pago sin cuotas'}</p>
                            <p><strong>Tarjeta:</strong> **** **** **** ${tx.card_detail?.card_number || '****'}</p>
                            <p><strong>Descripción:</strong> Compra de bienes o servicios</p>
                        `;
                    } else {
                        box.innerHTML = `
                            <p class="error"><strong>Orden de Compra ${tx?.buy_order || 'Desconocida'} rechazada</strong></p>
                            <p><strong>Estado:</strong> ${data.status}</p>
                            <p>Las posibles causas de este rechazo son:</p>
                            <ul>
                                <li>Error en el ingreso de los datos de su tarjeta de crédito o débito (fecha y/o código de seguridad).</li>
                                <li>Su tarjeta de crédito o débito no cuenta con saldo suficiente.</li>
                                <li>Tarjeta aún no habilitada en el sistema financiero.</li>
                            </ul>
                        `;
                    }
                })
                .catch(() => {
                    box.innerHTML = '<p class="error">Error al consultar los datos de la transacción.</p>';
                });
        }
    </script>

</body>

</html>
