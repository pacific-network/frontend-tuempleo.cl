<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planes y Carrito</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7f9fc;
            margin: 0;
            padding: 40px 20px;
            color: #05264E;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
        }

        .pricing-area {
            position: relative;
        }

        .pricing-wrapper {
            background: #F1F6FC;
            border-radius: 30px;
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .pricing-grid {
            display: grid;
            gap: 30px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .pricing-item {
            position: relative;
            overflow: hidden;
            padding: 40px;
            border-radius: 20px;
            z-index: 1;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .pricing-item.active {
            background: #3C65F5;
            color: white;
        }

        .pricing-popular {
            position: absolute;
            padding: 3px 15px;
            background: white;
            color: #3C65F5;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 600;
            border-radius: 50px;
            right: 15px;
            top: 15px;
        }

        .pricing-content h4 {
            margin-bottom: 10px;
            color: inherit;
        }

        .pricing-amount {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: inherit;
        }

        .pricing-amount span {
            font-size: 1rem;
            font-weight: 600;
        }

        .pricing-content p {
            font-size: 0.95rem;
            color: inherit;
        }

        .pricing-feature ul {
            margin: 20px 0 30px 0;
            padding-left: 0;
            list-style: none;
            color: inherit;
        }

        .pricing-feature ul li {
            margin: 10px 0;
            padding-left: 25px;
            position: relative;
        }

        .pricing-feature ul li::before {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border: 3px solid currentColor;
            border-radius: 50px;
            left: 0;
            top: 8px;
        }

        .theme-btn {
            background: #3C65F5;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .theme-btn:hover {
            background: #05264E;
        }

        .pricing-item.active .theme-btn {
            background: #fff;
            color: #3C65F5;
        }

        .pricing-item.active .theme-btn:hover {
            color: #fff;
            background: #1f3fa4;
        }

        .cart-summary {
            max-width: 600px;
            margin: 50px auto 0 auto;
            padding: 25px 30px;
            background: #fff;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            display: none;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .btn-checkout {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-checkout:hover {
            background-color: #d35400;
        }

        .empty-cart {
            text-align: center;
            margin-top: 40px;
            color: #999;
        }

        @media (max-width: 991px) {
            .pricing-item.active {
                margin-top: 0;
            }
        }
    </style>
</head>

<body>

    <!-- preloader -->
    <div class="preloader">
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <!-- preloader end -->



    <!-- header area -->
    <div id="header-placeholder"></div>
    <!-- header area end -->

    <h1>Selecciona un Plan</h1>

    <div class="pricing-area">
        <div class="pricing-wrapper">
            <div class="pricing-grid" id="planGrid"></div>
        </div>
    </div>

    <div class="cart-summary" id="cartSummary">
        <span>Total: $<strong id="cartTotal">0</strong></span>
        <button class="btn-checkout" id="checkoutBtn">Pagar Ahora</button>
    </div>

    <p class="empty-cart" id="emptyCartMsg">El carrito está vacío.</p>

    <script>
        const planes = [
            {
                id: 1,
                nombre: "Publicación Básica",
                precio: 15000,
                descripcion: "Ideal para pequeñas empresas.",
                caracteristicas: [
                    "Hasta 2 publicaciones",
                    "Duración: 7 días",
                    "Soporte básico"
                ],
                popular: false
            },
            {
                id: 2,
                nombre: "Plan Estándar",
                precio: 40000,
                descripcion: "Para empresas medianas.",
                caracteristicas: [
                    "Hasta 5 publicaciones",
                    "Duración: 30 días",
                    "Soporte prioritario",
                    "Reportes básicos"
                ],
                popular: true
            },
            {
                id: 3,
                nombre: "Plan Premium",
                precio: 90000,
                descripcion: "Para alto volumen de contratación.",
                caracteristicas: [
                    "Publicaciones ilimitadas",
                    "Duración: 60 días",
                    "Soporte 24/7",
                    "Consultoría avanzada"
                ],
                popular: false
            }
        ];

        let carrito = [];

        const planGrid = document.getElementById("planGrid");
        const cartSummary = document.getElementById("cartSummary");
        const cartTotal = document.getElementById("cartTotal");
        const checkoutBtn = document.getElementById("checkoutBtn");
        const emptyCartMsg = document.getElementById("emptyCartMsg");

        function renderPlanes() {
            planGrid.innerHTML = planes.map(plan => `
        <div class="pricing-item ${plan.popular ? 'active' : ''}">
          ${plan.popular ? `<div class="pricing-popular">Más popular</div>` : ''}
          <div class="pricing-content">
            <h4>${plan.nombre}</h4>
            <div class="pricing-amount">$${plan.precio.toLocaleString('es-CL')} <span>CLP</span></div>
            <p>${plan.descripcion}</p>
          </div>
          <div class="pricing-feature">
            <ul>
              ${plan.caracteristicas.map(c => `<li>${c}</li>`).join('')}
            </ul>
          </div>
          <button class="theme-btn" data-id="${plan.id}">Agregar al carrito</button>
        </div>
      `).join('');
        }

        function renderCarrito() {
            if (carrito.length === 0) {
                cartSummary.style.display = "none";
                emptyCartMsg.style.display = "block";
            } else {
                cartSummary.style.display = "flex";
                emptyCartMsg.style.display = "none";
                const total = carrito.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
                cartTotal.textContent = total.toLocaleString('es-CL');
            }
        }

        function agregarAlCarrito(id) {
            const plan = planes.find(p => p.id === id);
            if (!plan) return;

            const existente = carrito.find(p => p.id === id);
            if (existente) {
                existente.cantidad++;
            } else {
                carrito.push({ ...plan, cantidad: 1 });
            }
            alert(`"${plan.nombre}" agregado al carrito.`);
            renderCarrito();
        }

        planGrid.addEventListener("click", (e) => {
            if (e.target.classList.contains("theme-btn")) {
                const id = parseInt(e.target.dataset.id);
                agregarAlCarrito(id);
            }
        });

        checkoutBtn.addEventListener("click", () => {
            alert("Iniciando proceso de pago...");
            carrito = [];
            renderCarrito();
        });

        renderPlanes();
        renderCarrito();
    </script>
    <script src="../assets/js/jquery-3.6.0.min.js"></script>
    <script src="../assets/js/modernizr.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="../assets/js/jquery.magnific-popup.min.js"></script>
    <script src="../assets/js/isotope.pkgd.min.js"></script>
    <script src="../assets/js/jquery.appear.min.js"></script>
    <script src="../assets/js/jquery.easing.min.js"></script>
    <script src="../assets/js/owl.carousel.min.js"></script>
    <script src="../assets/js/counter-up.js"></script>
    <script src="../assets/js/masonry.pkgd.min.js"></script>
    <script src="../assets/js/wow.min.js"></script>
    <script src="../assets/js/nice-select.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/header-footer/loadHeaderFooter.js" defer></script>
</body>

</html>
