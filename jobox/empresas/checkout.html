<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificación de compra</title>
    <style>
        :root {
            --primary: #3C65F5;
            --primary-dark: #05264E;
            --primary-light: #587AF3;
            --primary-bg: #F2F6FD;
            --gray: #66789C;
            --gray-muted: #757F95;
            --gray-border: #E8E8E8;
            --gray-light: #F5F7FA;
            --gray-bg: #F1F6FC;
            --hover-bg: #E0EEFF;
            --white: #FFFFFF;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--primary-bg);
            color: var(--primary-dark);
            font-family: "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
            line-height: 1.5;
        }

        header {
            padding: 40px 24px 30px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-border);
            box-shadow: 0 2px 8px rgba(5, 38, 78, 0.05);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.9rem;
            color: var(--primary-dark);
        }

        .muted {
            color: var(--gray-muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            margin-top: 20px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--gray-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: 0 8px 20px rgba(5, 38, 78, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.3rem;
            color: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--gray-border);
            text-align: left;
        }

        th {
            color: var(--gray-muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .right {
            text-align: right;
        }

        .total {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-dark);
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--gray-border);
            background: var(--gray-light);
            color: var(--primary-dark);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(60, 101, 245, 0.15);
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: 0;
            padding: 14px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-light);
        }

        .btn.secondary {
            background: var(--white);
            border: 1px solid var(--gray-border);
            color: var(--primary-dark);
        }

        .btn.secondary:hover {
            background: var(--hover-bg);
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        /* === MÉTODOS DE PAGO === */
        .payopts {
            display: grid;
            gap: 16px;
            margin-top: 10px;
        }

        .payopt {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--gray-border);
            border-radius: var(--radius);
            background: var(--white);
            cursor: pointer;
            padding: 18px;
            transition: all 0.3s ease;
            height: 80px;
        }

        .payopt img {
            height: 40px;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .payopt:hover {
            border-color: var(--primary);
            background: var(--hover-bg);
            transform: translateY(-2px);
        }

        .payopt.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(60, 101, 245, 0.15);
            background: #ECF0FE;
        }

        /* Espaciado del botón de pagar */
        #payBtn {
            margin-top: 28px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .payopt {
                height: 65px;
            }

            .payopt img {
                height: 32px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Verificación de compra</h1>
        <p class="muted">Confirma los datos antes de realizar el pago.</p>
    </header>

    <main class="wrap">
        <div class="layout">
            <!-- ORDEN -->
            <section class="card">
                <h2>Tu Orden</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="right">Cantidad</th>
                            <th class="right">Precio</th>
                            <th class="right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="orderBody"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" class="right muted">Subtotal</td>
                            <td class="right" id="subtotalCell">$0</td>
                        </tr>
                        <tr>
                            <td colspan="3" class="right muted">IVA (19%)</td>
                            <td class="right" id="ivaCell">$0</td>
                        </tr>
                        <tr>
                            <td colspan="3" class="right total">TOTAL</td>
                            <td class="right total" id="totalCell">$0</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="actions">
                    <button class="btn secondary" id="backBtn">Seguir comprando</button>
                    <button class="btn" id="continueBtn">Continuar</button>
                </div>
            </section>

            <!-- DATOS Y PAGO -->
            <aside class="card">
                <h2>Datos y Pago</h2>
                <div class="sum">

                    <div>
                        <label>Método de pago</label>
                        <div class="payopts">
                            <div class="payopt" data-method="webpay">
                                <img src="../assets/img/logo/tbnk.jpeg" alt="Webpay (Transbank)" />
                            </div>
                            <div class="payopt" data-method="mercadopago">
                                <img src="../assets/img/logo/mp.jpeg" alt="Mercado Pago" />
                            </div>
                        </div>
                    </div>

                    <button class="btn" id="payBtn">Confirmar y pagar</button>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const CART_KEY = 'cartItems';
        const CLP = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' });
        const PRODUCTS = {
            'BASICO': { name: 'Aviso Básico', price: 7990 },
            'ESTANDAR': { name: 'Aviso Estándar', price: 14990 },
            'PREMIUM': { name: 'Aviso Premium', price: 27990 },
            'DESTACADO': { name: 'Aviso Destacado', price: 19990 },
        };

        let selectedMethod = null;

        document.querySelectorAll('.payopt').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.payopt').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedMethod = opt.dataset.method;
            });
        });

        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
            catch { return []; }
        }

        function totals(cart) {
            let subtotal = 0, items = 0;
            for (const c of cart) {
                const p = PRODUCTS[c.id];
                if (!p) continue;
                subtotal += p.price * c.qty;
                items += c.qty;
            }
            const iva = Math.round(subtotal * 0.19);
            const total = subtotal + iva;
            return { items, subtotal, iva, total };
        }

        function render() {
            const cart = getCart();
            const body = document.getElementById('orderBody');
            body.innerHTML = '';
            if (cart.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="muted">No hay productos en tu carrito.</td></tr>';
            } else {
                const t = totals(cart);
                for (const c of cart) {
                    const p = PRODUCTS[c.id];
                    if (!p) continue;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
            <td>${p.name}</td>
            <td class="right">${c.qty}</td>
            <td class="right">${CLP.format(p.price)}</td>
            <td class="right">${CLP.format(p.price * c.qty)}</td>`;
                    body.appendChild(tr);
                }
                document.getElementById('subtotalCell').textContent = CLP.format(t.subtotal);
                document.getElementById('ivaCell').textContent = CLP.format(t.iva);
                document.getElementById('totalCell').textContent = CLP.format(t.total);
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'products.html');
        document.getElementById('continueBtn').addEventListener('click', () => document.getElementById('name').focus());

        document.getElementById('payBtn').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            if (!name || !email) return alert('Completa tu nombre y email para continuar.');
            if (!selectedMethod) return alert('Selecciona un método de pago.');

            const cart = getCart();
            if (cart.length === 0) return alert('Tu carrito está vacío.');

            const t = totals(cart);
            alert(`Iniciando pago vía "${selectedMethod.toUpperCase()}" por ${CLP.format(t.total)}. (Simulado)`);
        });

        render();
    </script>
</body>

</html>
