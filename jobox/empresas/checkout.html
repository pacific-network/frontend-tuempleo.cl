<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificación de compra</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" />
    <style>
        :root {
            --primary: #3c65f5;
            --primary-dark: #05264e;
            --primary-light: #587af3;
            --accent: #8b9efc;
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --gray: #6b7280;
            --gray-muted: #9ca3af;
            --gray-border: #e2e8f0;
            --radius: 14px;
            --shadow-sm: 0 2px 6px rgba(60, 101, 245, 0.08);
            --shadow-md: 0 8px 24px rgba(5, 38, 78, 0.08);
            --gradient: linear-gradient(135deg, #3c65f5, #587af3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--primary-dark);
            font-family: "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
            line-height: 1.6;
            font-size: 15px;
        }

        header {
            padding: 40px 24px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.9rem;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }

        .muted {
            color: var(--gray);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 28px;
            margin-top: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--gray-border);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow-md);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(5, 38, 78, 0.12);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.3rem;
            color: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--gray-border);
            text-align: left;
        }

        th {
            color: var(--gray-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            color: var(--primary-dark);
            font-size: 0.95rem;
        }

        .right {
            text-align: right;
        }

        .total {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-dark);
        }

        /* === BOTONES === */
        .btn {
            background: var(--gradient);
            color: #fff;
            border: 0;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn.secondary {
            background: #fff;
            border: 1px solid var(--gray-border);
            color: var(--primary-dark);
            box-shadow: none;
        }

        .btn.secondary:hover {
            background: #f0f3ff;
            border-color: var(--primary);
            color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        /* === OPCIONES DE PAGO === */
        .payopts {
            display: grid;
            gap: 18px;
            margin-top: 10px;
        }

        .payopt {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--gray-border);
            border-radius: var(--radius);
            background: var(--card-bg);
            cursor: pointer;
            padding: 20px;
            transition: all 0.3s ease;
            height: 90px;
            box-shadow: var(--shadow-sm);
        }

        .payopt img {
            height: 42px;
            max-width: 160px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .payopt:hover {
            border-color: var(--primary);
            background: #eef3ff;
            transform: translateY(-2px);
        }

        .payopt.selected {
            border-color: var(--primary);
            background: #e8ecff;
            box-shadow: 0 0 0 3px rgba(60, 101, 245, 0.15);
        }

        #payBtn {
            margin-top: 28px;
            width: 100%;
        }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            header {
                padding: 28px 16px 24px;
            }

            .card {
                padding: 20px;
            }

            .payopt {
                height: 70px;
            }

            .payopt img {
                height: 32px;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>

</head>

<body>
    <header>
        <h1>Verificación de compra</h1>
        <p class="muted">Confirma los datos antes de realizar el pago.</p>
        <button class="btn secondary" id="cartBtn" onclick="location.href='shopping-cart.html'">Seguir
            comprando</button>

    </header>

    <main class="wrap">
        <div class="layout">
            <!-- 🧾 ORDEN -->
            <section class="card">
                <h2>Tu Orden</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="right">Cantidad</th>
                            <th class="right">Precio</th>
                            <th class="right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="orderBody"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" class="right muted">Subtotal</td>
                            <td class="right" id="subtotalCell">$0</td>
                        </tr>
                        <tr>
                            <td colspan="3" class="right muted">IVA (19%)</td>
                            <td class="right" id="ivaCell">$0</td>
                        </tr>
                        <tr>
                            <td colspan="3" class="right total">TOTAL</td>
                            <td class="right total" id="totalCell">$0</td>
                        </tr>
                    </tfoot>
                </table>
                <div class="actions">
                    <button class="btn secondary" id="backBtn">Seguir comprando</button>
                </div>
            </section>

            <!-- 💳 DATOS Y PAGO -->
            <aside class="card">
                <h2>Método de Pago</h2>
                <div class="payopts">
                    <div class="payopt" data-method="webpay">
                        <img src="../assets/img/logo/tbnk.jpeg" alt="Webpay (Transbank)" />
                    </div>
                    <div class="payopt" data-method="mercadopago">
                        <img src="../assets/img/logo/mp.jpeg" alt="Mercado Pago" />
                    </div>
                </div>
                <button class="btn" id="payBtn">Confirmar y pagar</button>
            </aside>
        </div>
    </main>

    <!-- JS -->
    <script src="../assets/js/config/config.js"></script>
    <script src="../assets/js/modules/transacciones/checkout.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
