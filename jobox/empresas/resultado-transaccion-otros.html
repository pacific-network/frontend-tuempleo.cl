<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Resultado de la Transacción — Mercado Pago</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --brand: #3C65F5;
            --ink: #0f172a;
            --muted: #64748b;
            --bg: #f4f7ff;
            --surface: #ffffff;
            --border: #e6eaf3;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica", Arial, sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        .wrap {
            max-width: 900px;
            margin: 48px auto;
            padding: 0 16px
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, .06);
            padding: 0
        }

        .shell {
            padding: 28px
        }

        .invoice {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #fff
        }

        .invoice__header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #fff, #fafcff)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .brand__logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 24px rgba(60, 101, 245, .15);
            border: 1px solid var(--border);
            background: #fff
        }

        .brand__logo img {
            width: 100%;
            height: 100%;
            object-fit: contain
        }

        .brand__text {
            line-height: 1.2
        }

        .brand__title {
            margin: 0;
            font-size: 22px;
            font-weight: 800
        }

        .brand__subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }

        .badge {
            font-weight: 800;
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 16px;
            letter-spacing: .6px;
            border: 0;
            box-shadow: 0 10px 22px rgba(0, 0, 0, .06)
        }

        .badge--ok {
            color: #065f46;
            background: #bbf7d0
        }

        .badge--fail {
            color: #7f1d1d;
            background: #fecaca
        }

        .invoice__body {
            padding: 10px 24px 20px
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: 1.4fr .9fr
        }

        @media (max-width:800px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            background: #fff
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden
        }

        .table th,
        .table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .right {
            text-align: right
        }

        .money {
            font-weight: 800
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap
        }

        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none
        }

        .btn-primary {
            background: #3C65F5;
            color: #fff
        }

        .btn-secondary {
            background: #64748b;
            color: #fff
        }

        .btn-outline {
            background: #fff;
            color: #3C65F5;
            border: 2px solid #3C65F5
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <div class="shell">
                <div id="contenedor">Verificando información de Mercado Pago…</div>
                <div class="actions" id="acciones" style="display:none">
                    <button class="btn btn-secondary" id="copyBtn">Copiar comprobante</button>
                    <button class="btn btn-outline" id="downloadBtn">Descargar comprobante (PDF)</button>
                    <a class="btn btn-primary" id="continueBtn" href="employer-transaction.html">Continuar</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/config/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <script>
        (async () => {
            const qs = new URLSearchParams(location.search);
            const paymentId = qs.get("payment_id") || qs.get("collection_id");
            const prefId = qs.get("preference_id") || qs.get("pref_id") || qs.get("token");
            const cont = document.getElementById("contenedor");
            const acc = document.getElementById("acciones");
            const btnCopy = document.getElementById("copyBtn");
            const btnDown = document.getElementById("downloadBtn");
            const btnGo = document.getElementById("continueBtn");
            const REDIRECT_OK = "./employer-post-job.html";
            const REDIRECT_FAIL = "./carrito.html";

            const toast = (icon, title) =>
                Swal.fire({
                    toast: true,
                    icon,
                    title,
                    position: "top-end",
                    showConfirmButton: false,
                    timer: 1500,
                    timerProgressBar: true,
                });

            // 🚫 Validar parámetros
            if (!paymentId) {
                cont.innerHTML = `<p style="color:#64748b">No se encontró información de la transacción.</p>`;
                return;
            }

            try {
                Swal.fire({
                    title: "Procesando...",
                    html: "Consultando el estado del pago en Mercado Pago.",
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading(),
                });

                // ✅ Consultar el detalle directamente desde el backend
                const res = await fetch(
                    `${BASE_URL_API}/mercadopago/detail?payment_id=${encodeURIComponent(paymentId)}`
                );

                const data = await res.json();
                Swal.close();

                if (!res.ok) throw new Error(data.message || "Error consultando detalle");

                const tx = data.data || {};
                const ok = ["AUTHORIZED", "APPROVED"].includes(
                    String(tx.status || "").toUpperCase()
                );
                const items = tx.response_data?.items || [];
                const subtotal = Math.round(tx.amount / 1.19);
                const iva = tx.amount - subtotal;

                cont.innerHTML = renderInvoice({
                    ok,
                    buyOrder: tx.orderId,
                    fecha: new Date(tx.updatedAt).toLocaleString("es-CL"),
                    total: tx.amount,
                    subtotal,
                    iva,
                    items,
                });

                acc.style.display = "flex";
                btnGo.href = ok ? REDIRECT_OK : REDIRECT_FAIL;
                if (ok) localStorage.removeItem("cart_items");
                bindCopy();
                bindDownload(tx.orderId);
            } catch (e) {
                console.error(e);
                Swal.close();
                cont.innerHTML = `<p style="color:red;">No se pudo obtener la información del pago.</p>`;
                acc.style.display = "flex";
            }

            // ==============================
            // 🧾 Render del comprobante
            // ==============================
            function renderInvoice({ ok, buyOrder, fecha, total, subtotal, iva, items = [] }) {
                const badge = ok ? 'badge--ok">APROBADO' : 'badge--fail">NO APROBADO';
                const fmtCLP = (n) =>
                    Number(n || 0).toLocaleString("es-CL", {
                        style: "currency",
                        currency: "CLP",
                    });
                const rows = items.length
                    ? items
                        .map(
                            (it) =>
                                `<tr><td>${it.title}</td><td class="right">${it.quantity}</td><td class="right">${fmtCLP(
                                    it.unit_price
                                )}</td></tr>`
                        )
                        .join("")
                    : `<tr><td colspan="3" class="right muted">Sin detalle disponible</td></tr>`;

                return `
              <section class="invoice" id="invoice">
                <header class="invoice__header">
                  <div class="brand">
                    <div class="brand__logo"><img src="../assets/img/logo/favicon.png" alt="Logo Tu Empleo" /></div>
                    <div class="brand__text">
                      <p class="brand__title">Tu Empleo</p>
                      <p class="brand__subtitle">Comprobante de pago (Mercado Pago)</p>
                    </div>
                  </div>
                  <div class="badge ${badge}</div>
                </header>
                <div class="invoice__body">
                  <div class="grid">
                    <div class="panel">
                      <h4>Detalle de la compra</h4>
                      <ul class="kv">
                        <li><b>Orden de compra</b> <span>${buyOrder}</span></li>
                        <li><b>Fecha</b> <span>${fecha}</span></li>
                        <li><b>Pasarela</b> <span>Mercado Pago</span></li>
                        <li><b>Estado</b> <span>${ok ? "Aprobado" : "Pendiente o Rechazado"}</span></li>
                      </ul>
                      <h4 style="margin-top:16px">Planes adquiridos</h4>
                      <table class="table">
                        <thead><tr><th>Producto</th><th class="right">Cant.</th><th class="right">Importe</th></tr></thead>
                        <tbody>${rows}</tbody>
                      </table>
                    </div>
                    <div class="panel">
                      <h4>Resumen</h4>
                      <table class="table">
                        <tbody>
                          <tr><td>Subtotal</td><td class="right">${fmtCLP(subtotal)}</td></tr>
                          <tr><td>IVA (19%)</td><td class="right">${fmtCLP(iva)}</td></tr>
                          <tr><td><strong>Total</strong></td><td class="right money">${fmtCLP(total)}</td></tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
                <footer class="invoice__footer" style="padding:12px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#64748b;font-size:12px;background:#fcfdff">
                  <div>Soporte: soporte@tuempleo.cl</div>
                </footer>
              </section>`;
            }

            // ==============================
            // 📋 Copiar comprobante
            // ==============================
            function bindCopy() {
                btnCopy.onclick = async () => {
                    const ul = document.querySelector("#invoice .kv");
                    const bullets = [...ul.querySelectorAll("li")]
                        .map((li) => {
                            const b = li.querySelector("b")?.innerText || "";
                            const s = li.querySelector("span")?.innerText || "";
                            return `• ${b}: ${s}`;
                        })
                        .join("\n");
                    try {
                        await navigator.clipboard.writeText(bullets);
                        toast("success", "Comprobante copiado");
                    } catch {
                        toast("error", "No se pudo copiar automáticamente");
                    }
                };
            }

            // ==============================
            // 💾 Descargar comprobante PDF
            // ==============================
            function bindDownload(numeroTransaccion = "SinNumero") {
                btnDown.onclick = async () => {
                    try {
                        const raw = (numeroTransaccion ?? "").toString().trim();
                        const fallback = new Date()
                            .toISOString()
                            .replace(/[-:T.Z]/g, "")
                            .slice(0, 14);
                        const safeNumber = (raw || fallback).replace(/[^A-Za-z0-9_-]/g, "");
                        const filename = `ComprobanteTransaccion_${safeNumber}.pdf`;
                        const area = document.getElementById("invoice");
                        const canvas = await html2canvas(area, {
                            scale: 2,
                            useCORS: true,
                            backgroundColor: "#fff",
                        });
                        const imgData = canvas.toDataURL("image/png");
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF("p", "mm", "a4");
                        const pageW = pdf.internal.pageSize.getWidth();
                        const pageH = pdf.internal.pageSize.getHeight();
                        const margin = 10;
                        let imgW = pageW - margin * 2;
                        let imgH = (canvas.height * imgW) / canvas.width;
                        if (imgH > pageH - margin * 2) {
                            imgH = pageH - margin * 2;
                            imgW = (canvas.width * imgH) / canvas.height;
                        }
                        pdf.addImage(
                            imgData,
                            "PNG",
                            (pageW - imgW) / 2,
                            margin,
                            imgW,
                            imgH,
                            undefined,
                            "FAST"
                        );
                        pdf.save(filename);
                        toast("success", "Descarga lista");
                    } catch (err) {
                        console.error(err);
                        toast("error", "No se pudo generar el PDF");
                    }
                };
            }
        })();
    </script>


</body>

</html>
