                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="comuna_empleador" class="required-field">Comuna</label>
                                                    <select id="comuna_empleador" name="comuna_empleador" class="form-control"
                                                        disabled required>
                                                        <option value="">Seleccione una comuna</option>
                                                        <!-- Opciones dinámicas -->
                                                    </select>
                                                </div>
                                            </div>
                                        
                                        
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cargo_empleador" class="required-field">Direccion</label>
                                                    <input type="text" id="direccion_empleador" name="direccion_empleador" ...

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('businessForm'); // Asegúrate que este sea el ID real
        if (!form) return;

        form.addEventListener('submit', function () {
          const calle = document.getElementById('direccion_texto').value.trim();
          const numero = document.getElementById('numero_texto').value.trim();
          const campoDireccion = document.getElementById('direccion');

          if (campoDireccion) {
            campoDireccion.value = `${calle} ${numero}`.trim();
          }
        });
      });
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
          logoutBtn.addEventListener('click', function () {
            localStorage.removeItem('token');
          });
        }
      });
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('descripcion_empresa');
      const contador = document.getElementById('contadorDescripcion');
    
      textarea.addEventListener('input', () => {
        const largo = textarea.value.length;
        contador.textContent = `${largo} / 500 caracteres`;
      });
    });
    </script>

    <script src="../assets/js/modules/empresa/form-registro-empresa.js"></script>
    <script src="../assets/js/modules/empresa/info-rut-empresa.js"></script>
    <script src="../assets/js/modules/empresa/funciones.js"></script>
    <script src="../assets/js/shared/custom-alert.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        tooltipTriggerList.map(el => new bootstrap.Tooltip(el))
      });
    </script>
    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            const rutInput = document.getElementById('rutInput');
            const razonInput = document.getElementById('razon_social');
            const categoria = document.getElementById('categoria');

            let valid = true;

            if (!rutInput.checkValidity()) {
                rutInput.classList.add('is-invalid');
                valid = false;
            } else {
                rutInput.classList.remove('is-invalid');
            }

            if (!razonInput.checkValidity()) {
                razonInput.classList.add('is-invalid');
                valid = false;
            } else {
                razonInput.classList.remove('is-invalid');
            }

            if (!categoria.checkValidity()) {
                categoria.classList.add('is-invalid');
                valid = false;
            } else {
                categoria.classList.remove('is-invalid');
            }

            if (!valid) {
                e.preventDefault();
            }
        });
    </script>
