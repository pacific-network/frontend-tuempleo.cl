                    <h4 class="user-profile-card-title">Datos de Empresa</h4>

                        <!-- INICIO FORMULARIO EMPRESA -->
                        <div class="profile-resume">
                            <div class="profile-form">
                                <form id="businessForm" action="#">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="rutInput">RUT</label>
                                                <div class="input-group">
                                                    <input type="text" id="rutInput" name="rutInput" class="form-control" data-bs-toggle="tooltip"
                                                        placeholder="Ingrese el RUT de la Empresa" pattern="[0-9]{7,8}-[0-9kK]" data-bs-placement="bottom"
                                                        title="Formato válido: 12.345.678-9 o 12345678-9">
                                                    <button class="btn btn-primary" type="button"
                                                        id="consultarRutBtn">Consultar</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="razon_social">Razón Social</label>
                                                <input type="text" id="razon_social" name="razon_social" class="form-control"
                                                    placeholder="Ingrese la Razón Social">
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="nombre_empresa">Nombre de la Empresa</label>
                                                <input type="text" id="nombre_empresa" name="nombre_empresa"
                                                    class="form-control" placeholder="Ingrese el Nombre de la Empresa">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="categoria">Categoría</label>
                                                <select class="form-control" id="categoria" name="categoria">
                                                    <option value="">Seleccione una opción</option>
                                                    <option value="1">Primera Categoria</option>
                                                    <option value="2">Segunda Categoria</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="correo_empresa">Correo Empresa</label>
                                                <input type="email" id="correo_empresa" name="correo_empresa"
                                                    class="form-control" placeholder="Ingrese Correo">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="actividad_empresa">Actividad Empresa</label>
                                                <input class="form-control" name="actividad_empresa" id="actividad_empresa">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="pais">País</label>
                                                <input type="text" id="pais" name="pais" class="form-control"
                                                    placeholder="Ingrese País" value="Chile">
                                            
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="region_empresa">Región</label>
                                                <select id="region_empresa" name="region_empresa" class="form-control">
                                                    <option value="">Seleccione una región</option>
                                                    <!-- Opciones dinámicas -->
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="comuna_empresa">Comuna</label>
                                                <select id="comuna_empresa" name="comuna_empresa" class="form-control" disabled>
                                                    <option value="">Seleccione una comuna</option>
                                                    <!-- Opciones dinámicas -->
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="direccion_texto">Dirección</label>
                                                <input type="text" id="direccion_texto" class="form-control" placeholder="Ingrese dirección">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="numero_texto">Número Calle</label>
                                                <input type="text" id="numero_texto" class="form-control" placeholder="Ingrese número">
                                            </div>
                                        </div>
                                        <input type="hidden" id="direccion" name="direccion">
                                        <div class="col-md-4">
                                            <div class="form-group">
                                                <label for="tamano_equipo">Tamaño Equipo</label>
                                                <select class="form-control" id="tamano_equipo" name="tamano_equipo">
                                                    <option value="">Seleccione Tamaño de equipo</option>
                                                    <option value="1">MicroEmpresa(1-9 trabajadores)</option>
                                                    <option value="2">Pequeña Empresa(10-49 trabajadores)</option>
                                                    <option value="3">Mediana Empresa(50-199 trabajadores)</option>
                                                    <option value="4">Gran Empresa(+200 trabajadores)</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label for="anio_inicio_actividades">Año Inicio Actividades</label>
                                                <input type="number" id="anio_inicio_actividades" name="anio_inicio_actividades"

                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="form-group">
                                                <label>Fono Empresa</label>
                                                <div class="input-group">
                                                    <span class="input-group-text">+56</span>
                                                    <input type="text" class="form-control" placeholder="Ej: 9 1234 5678"
                                                        id="numero_telefono_empresa" name="numero_telefono_empresa">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-12">
                                            <div class="form-group">
                                                <label for="descripcion_empresa">Descripción de Empresa</label>
                                                <textarea class="form-control" id="descripcion_empresa"
                                                    name="descripcion_empresa" cols="30" rows="5"
                                                    placeholder="Escriba una breve descripción de la empresa"></textarea>
                                            </div>
                                        </div>
                                    
                                        <!-- INICIO FORMULARIO EMPLEADOR -->
                                    
                                        <div class="row mt-4">
                                            <h6 class="mb-3">Datos Usuario Empresa</h6>
                                            <div class="form-group col-md-4">
                                                <label for="rut_empleador">RUT</label>
                                                <div class="input-group">
                                                    <input type="text" id="rut_empleador" name="rut_empleador"
                                                        class="form-control" placeholder="Ingresa tu RUT (ej:18275903-2)"
                                                        pattern="^\d{7,8}-[kK\d]$" title="El formato debe ser XXXXXXXX-X">
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="nombre_empleador">Nombre</label>
                                                    <input type="text" id="nombre_empleador" name="nombre_empleador"

                                                </div>
                                            </div>
                                            <div class="col-md-4">

                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cargo_empleador">Pais</label>
                                                    <input type="text" id="pais_empleador" name="pais_empleador" ...
                                                        class="form-control" placeholder="Ingrese su País">
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="region_empleador">Región</label>

                                                        <!-- Opciones dinámicas -->
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="comuna_empleador">Comuna</label>
                                                    <select id="comuna_empleador" name="comuna_empleador" class="form-control"
                                                        disabled>
                                                        <option value="">Seleccione una comuna</option>
                                                        <!-- Opciones dinámicas -->
                                                    </select>
                                                </div>
                                            </div>
                                        
                                        
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cargo_empleador">Direccion</label>
                                                    <input type="text" id="direccion_empleador" name="direccion_empleador" ...
                                                        class="form-control" placeholder="Ingrese su Dirección">
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="correo_empleador">Correo</label>
                                                    <input type="email" id="correo_empleador" name="correo_empleador"
                                                        class="form-control" placeholder="Ingrese su Correo">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label>Fono Empleador</label>
                                                    <div class="input-group">
                                                        <span class="input-group-text">+56</span>
                                                        <input type="text" class="form-control" placeholder="Ej: 9 1234 5678"
                                                            id="numero_telefono_empleador" name="numero_telefono_empleador" />
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="cargo_empleador">Cargo</label>
                                                    <input type="text" id="cargo_empleador" name="cargo_empleador" ...
                                                        class="form-control" placeholder="Ingrese su Cargo">
                                                </div>
                                            </div>
                                        </div>
                                    
                                        <div class="row mt-4">
                                            <h6 class="mb-3">Enlaces sociales</h6>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="facebook">URL de Facebook</label>
                                                    <input type="url" id="facebook" name="facebook" class="form-control"
                                                        placeholder="https://www.facebook.com/">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="twitter">URL de Twitter</label>
                                                    <input type="url" id="twitter" name="twitter" class="form-control"
                                                        placeholder="https://www.twitter.com/">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="linkedin">URL de Linkedin</label>
                                                    <input type="url" id="linkedin" name="linkedin" class="form-control"
                                                        placeholder="https://www.linkedin.com/">
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="instagram">URL de Instagram</label>
                                                    <input type="url" id="instagram" name="instagram" class="form-control"
                                                        placeholder="https://www.instagram.com/">
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group mt-3">
                                                    <button type="submit" class="theme-btn"><span
                                                            class="far fa-paper-plane"></span> Enviar Datos</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                
                                </form>
                            </div>

                        <!-- Overlay difuminado -->
                        <div id="rut-overlay"
                            class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none"

                        <div id="rut-loading-toast"

                                <strong class="me-2">🔎 Consultando RUT...</strong>
                                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                            </div>
                        </div>

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"

                <div class="toast-body" id="toastBody" style="background-color: #C2D7F2; color: #083359;">
                    Texto de ejemplo

    <script>
        document.getElementById('form-id').addEventListener('submit', function (e) {
          const dir = document.getElementById('direccion_texto').value.trim();
          const num = document.getElementById('numero_texto').value.trim();
        
          const direccionCompleta = `${dir} ${num}`;
          document.getElementById('direccion').value = direccionCompleta;
        });
    </script>
