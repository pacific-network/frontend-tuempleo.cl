<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes y Carrito</title>

  <!-- CSS base del proyecto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" />
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    :root {
      --brand: #3C65F5;
      --brand-dark: #1f3fa4;
      --ink: #05264E;
      --muted: #667085;
      --surface: #ffffff;
      --panel: #F1F6FC;
      --ok: #e67e22;
      --ok-dark: #d35400;
      --ring: 0 12px 24px rgba(60, 101, 245, .18);
      --ring-ghost: 0 8px 24px rgba(0, 0, 0, .06);
      --border: #e9eef7;
      --line: #e6ecf6;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(60, 101, 245, .08), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(12, 115, 255, .06), transparent 55%),
        #f7f9fc;
      margin: 0;
      padding: 40px 16px 40px;
      color: var(--ink);
    }

    h1 {
      text-align: center;
      font-size: clamp(1.8rem, 1.2rem + 2vw, 2.6rem);
      margin: 0 0 28px 0;
      letter-spacing: .2px;
    }

    /* Contenedor central reducido */
    .pricing-wrapper {
      background: var(--panel);
      border-radius: 28px;
      padding: clamp(18px, 3vw, 40px);
      width: 80%;
      max-width: 960px;
      /* <-- antes 1200, ahora 20% más reducido */
      margin: auto;
      box-shadow: var(--ring-ghost);
    }

    /* Estado base (se sobreescribe abajo en breakpoints) */
    .pricing-grid {
      display: grid;
      gap: clamp(16px, 2.2vw, 28px);
      grid-template-columns: repeat(4, 1fr);
    }

    @media (max-width:1200px) {
      .pricing-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width:640px) {
      .pricing-grid {
        grid-template-columns: 1fr
      }
    }

    .pricing-item {
      position: relative;
      overflow: hidden;
      padding: 26px 24px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--ring-ghost);
      transition: .18s ease;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    .pricing-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .08);
      border-color: #dde6f3
    }

    .pricing-item.active {
      background: linear-gradient(180deg, var(--brand) 0%, #5b7cff 100%);
      color: #fff;
      border: none;
      box-shadow: var(--ring);
    }

    .pricing-popular {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      border-radius: 999px;
      background: #fff;
      color: var(--brand);
      box-shadow: 0 10px 20px rgba(255, 255, 255, .35);
      border: 1px solid rgba(255, 255, 255, .7);
    }

    .pricing-content h4 {
      margin: 0 0 6px 0;
      font-size: clamp(1.1rem, .9rem + .6vw, 1.3rem)
    }

    .pricing-amount {
      font-size: clamp(1.8rem, 1.4rem + 1.2vw, 2.1rem);
      font-weight: 800;
      margin: 0;
    }

    .pricing-feature ul {
      margin: 4px 0 6px 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .pricing-feature ul li {
      position: relative;
      padding-left: 26px;
      line-height: 1.25rem
    }

    .pricing-feature ul li::before {
      content: "\f00c";
      font: normal normal normal 14px/1 FontAwesome;
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(60, 101, 245, .12);
      color: var(--brand);
    }

    .theme-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s, transform .08s, box-shadow .2s;
      box-shadow: 0 10px 18px rgba(60, 101, 245, .22);
      width: 100%;
    }

    .theme-btn:hover {
      background: var(--brand-dark)
    }

    .theme-btn[disabled] {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ===== Carrito ===== */
    .cart-summary {
      position: fixed;
      right: 24px;
      top: 120px;
      width: 360px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, .12);
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }

    .cart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #f8fbff;
      border-bottom: 1px solid var(--border);
    }

    .cart-table {
      padding: 12px 16px;
    }

    .cart-table .row {
      display: grid;
      grid-template-columns: 1fr 90px 120px;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line);
      font-size: .95rem;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .btn-remove {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 0;
      background: #ef4444;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(239, 68, 68, .25);
      transition: transform .08s ease, background .18s ease, box-shadow .18s ease;
    }

    .btn-remove:hover {
      background: #dc2626;
      box-shadow: 0 8px 18px rgba(239, 68, 68, .35)
    }

    .btn-remove:active {
      transform: translateY(1px)
    }

    .btn-remove svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .totals {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
    }

    .totals .line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .totals .line.total {
      border-top: 1px solid var(--line);
      margin-top: 6px;
      padding-top: 10px;
      font-weight: 800;
      font-size: 1.05rem
    }

    .cart-footer {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .btn-checkout {
      background: var(--ok);
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: .98rem;
      font-weight: 800;
      cursor: pointer;
    }

    .empty-cart {
      position: fixed;
      right: 24px;
      top: 120px;
      width: 360px;
      padding: 18px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, .08);
      color: var(--muted);
    }

    @media (max-width:768px) {

      .cart-summary,
      .empty-cart {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        bottom: 18px;
        top: auto;
        width: min(720px, 92vw);
      }

      .cart-head {
        display: none
      }
    }

    /* Topbar + botón volver */
    .topbar {
      max-width: 1200px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--border);
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--ring-ghost);
      transition: transform .08s ease, background .18s ease, box-shadow .18s ease, color .18s ease, border-color .18s ease;
    }

    .btn-back:hover {
      background: #f8fbff;
      color: var(--brand-dark);
      border-color: #dbe7ff;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(60, 101, 245, .12);
    }

    .btn-back i {
      font-size: 14px;
    }

    /* ====== Precio lista con X roja ====== (20% más pequeño) */
    .pricing-amount .price-list {
      position: relative;
      display: inline-block;
      vertical-align: baseline;
      margin-right: 12px;
      padding: 0 .25em;
      color: inherit !important;
      font-size: 0.8em !important;
      font-weight: 800;
      line-height: 1.1;
    }

    .pricing-amount .price-list::before,
    .pricing-amount .price-list::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      top: 50%;
      height: 3px;
      background: #ef4444;
      transform: rotate(18deg);
    }

    .pricing-amount .price-list::after {
      transform: rotate(-18deg);
    }

    /* Badge contador gratis */
    .free-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 800;
      background: #f1f6ff;
      color: #1f3fa4;
      border: 1px solid #dbe7ff;
      margin-top: 6px;
    }

    .free-badge i {
      font-size: .9rem
    }

    /* ====== Layout como en el mock (centrado y ancho fijo por card) ====== */
    @media (min-width: 992px) {
      .pricing-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        justify-content: center;
      }

      .pricing-item {
        flex: 0 0 calc((100% - 72px) / 4);
        /* 4 columnas, 3 gaps de 24px */
        max-width: 300px;
      }
    }

    @media (min-width: 640px) and (max-width: 991.98px) {
      .pricing-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .pricing-item {
        flex: 0 0 calc((100% - 20px) / 2);
        max-width: 420px;
      }
    }

    @media (max-width: 639.98px) {
      .pricing-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }

      .pricing-item {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>

  <!-- preloader -->
  <div class="preloader">
    <div class="loader"><span></span><span></span><span></span></div>
  </div>
  <div class="topbar">
    <a href="employer-dashboard.html" class="btn-back" aria-label="Volver al panel de empresa">
      <i class="fa fa-arrow-left" aria-hidden="true"></i>
      Volver al panel
    </a>
  </div>

  <!-- header -->
  <div id="header-placeholder"></div>

  <h1>Selecciona un Aviso</h1>

  <div class="pricing-area">
    <div class="pricing-wrapper">
      <div class="pricing-grid" id="planGrid"></div>
    </div>
  </div>

  <!-- Panel del carrito -->
  <div class="cart-summary" id="cartSummary">
    <div class="cart-head">
      <h3><i class="fa fa-shopping-cart"></i> Tu Carrito</h3>
    </div>

    <div class="cart-table">
      <div class="row header">
        <div>Producto</div>
        <div>Cant.</div>
        <div>Monto (CLP)</div>
      </div>
      <div id="cartItems"></div>
    </div>

    <!-- DESGLOSE -->
    <div class="totals">
      <div class="line"><span>Subtotal</span><strong id="cartSubtotal">$0</strong></div>
      <div class="line"><span>IVA (19%)</span><strong id="cartIva">$0</strong></div>
      <div class="line"><span>Descuento</span><strong id="cartDiscount">$0</strong></div>
      <div class="line total"><span>Total</span><strong id="cartTotal">$0</strong></div>
    </div>

    <div class="cart-footer" style="justify-content:space-between; flex-wrap:wrap; gap:12px">
      <div class="discount-wrap" style="display:flex; gap:8px; align-items:center; flex:1 1 340px">
        <input id="discountCode" class="form-control" placeholder="Código de descuento"
          style="max-width:260px; text-transform:uppercase" minlength="20" maxlength="20" pattern="^[A-Z0-9]{20}$"
          inputmode="latin" autocomplete="off" />
        <button class="btn btn-outline-primary" id="btnCheckCode" type="button">Validar</button>
        <span id="discountStatus" style="font-size:.9rem; color:var(--muted)"></span>
      </div>

      <button class="btn-checkout" id="checkoutBtn">Pagar Ahora</button>
    </div>
  </div>

  <!-- Mensaje vacío -->
  <p class="empty-cart" id="emptyCartMsg">El carrito está vacío.</p>

  <!-- libs -->
  <script src="../assets/js/jquery-3.6.0.min.js"></script>
  <script src="../assets/js/modernizr.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/imagesloaded.pkgd.min.js"></script>
  <script src="../assets/js/jquery.magnific-popup.min.js"></script>
  <script src="../assets/js/isotope.pkgd.min.js"></script>
  <script src="../assets/js/jquery.appear.min.js"></script>
  <script src="../assets/js/jquery.easing.min.js"></script>
  <script src="../assets/js/owl.carousel.min.js"></script>
  <script src="../assets/js/counter-up.js"></script>
  <script src="../assets/js/masonry.pkgd.min.js"></script>
  <script src="../assets/js/wow.min.js"></script>
  <script src="../assets/js/nice-select.min.js"></script>
  <script src="../assets/js/config/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/header-footer/loadHeaderFooter.js" defer></script>
  <script src="../assets/js/modules/transacciones/shopping-cart.js" defer></script>

</body>

</html>
