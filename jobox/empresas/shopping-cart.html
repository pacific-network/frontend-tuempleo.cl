<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes y Carrito</title>

  <!-- Fuentes / CSS base del proyecto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />



  <!-- ===== UI más grande + estética (ancho más estrecho) ===== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-dark: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      --color-primary: #667eea;
      --color-secondary: #f5576c;
      --color-success: #00f2fe;
      --color-text: #2d3748;
      --color-text-light: #718096;
      --color-border: rgba(226, 232, 240, .8);
      --color-surface: rgba(255, 255, 255, .95);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, .08);
      --shadow-lg: 0 18px 52px rgba(0, 0, 0, .12);
      --shadow-xl: 0 28px 70px rgba(0, 0, 0, .16);
      --radius-full: 9999px;
      --radius-lg: 32px;
      --blur: blur(20px);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(102, 126, 234, .08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(245, 87, 108, .06) 0%, transparent 50%),
        radial-gradient(circle at 40% 90%, rgba(74, 172, 254, .05) 0%, transparent 50%),
        linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%);
      color: var(--color-text);
      min-height: 100vh;
      padding: 28px;
      overflow-x: hidden;
    }

    /* === Card activa (Publicación Estándar) === */
    .pricing-item.active .pricing-content h4,
    .pricing-item.active .price-main,
    .pricing-item.active .currency,
    .pricing-item.active .price-list,
    .pricing-item.active .pricing-content p,
    .pricing-item.active .pricing-feature li {
      color: #fff !important;
    }

    .pricing-item.active .price-list::before,
    .pricing-item.active .price-list::after {
      background: rgba(255, 255, 255, 0.9) !important;
    }

    .pricing-item.active .price-main {
      color: #fff;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .pricing-item.active .currency {
      color: rgba(255, 255, 255, 0.85);
    }

    .pricing-item.active .pricing-feature li::before {
      background: var(--gradient-success);
      box-shadow: 0 3px 8px rgba(0, 242, 254, 0.3);
    }

    .pricing-item.active .theme-btn {
      background: #fff;
      color: var(--color-primary);
    }

    /* ===== Header ===== */
    .header-container {
      max-width: 1100px;
      margin: 0 auto 28px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      color: var(--color-text);
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--shadow-md);
      transition: .3s;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      background: #fff;
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    /* ===== Hero ===== */
    .hero {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 36px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 4.2vw, 3.2rem);
      font-weight: 900;
      line-height: 1.08;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--color-text-light);
      font-weight: 600;
      font-size: clamp(1rem, 1.2vw, 1.08rem);
    }

    /* ===== Layout ===== */
    .page-width {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    /* ===== Cards ===== */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 20px;
    }

    .pricing-item {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 30px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-md);
      transition: .3s;
    }

    .pricing-item:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
    }

    .pricing-item.active {
      background: var(--gradient-primary);
      color: #fff;
      border: none;
    }

    .pricing-popular {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 7px 12px;
      font-size: .78rem;
      font-weight: 900;
      border-radius: 999px;
      background: #fff;
      color: #667eea;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .12);
    }

    .pricing-content h4 {
      font-size: 1.18rem;
      font-weight: 900;
    }

    .pricing-amount {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 8px 0 6px;
    }

    .price-list {
      position: relative;
      display: inline-block;
      font-size: 1.02rem;
      color: var(--color-text-light);
      opacity: .75;
    }

    .price-list::before,
    .price-list::after {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;
      height: 2px;
      background: var(--gradient-secondary);
      transform-origin: center;
      border-radius: 2px;
      opacity: 0.9;
    }

    .price-list::before {
      transform: rotate(10deg);
    }

    .price-list::after {
      transform: rotate(-10deg);
    }

    .price-main {
      font-size: clamp(1.8rem, 2.4vw, 2.1rem);
      font-weight: 900;
    }

    .currency {
      font-size: .95rem;
      color: var(--color-text-light);
    }

    /* ===== Características ===== */
    .pricing-feature ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pricing-feature li {
      position: relative;
      padding-left: 28px;
    }

    .pricing-feature li::before {
      content: '\f00c';
      font-family: 'FontAwesome';
      position: absolute;
      left: 0;
      top: 2px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--gradient-success);
      color: #fff;
      font-size: 10px;
    }

    /* ===== Botones ===== */
    .theme-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 200px;
      height: 50px;
      border: none;
      border-radius: 16px;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 10px 28px rgba(102, 126, 234, .32);
      cursor: pointer;
      transition: .25s ease;
    }

    .theme-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(102, 126, 234, .4);
    }

    .theme-btn:disabled {
      background: linear-gradient(135deg, #cbd5e0, #a0aec0);
      opacity: .7;
      cursor: not-allowed;
    }

    /* ===== PANEL FLOTANTE ===== */
    .cart-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 380px;
      height: 100vh;
      background: var(--color-surface);
      box-shadow: -10px 0 25px rgba(0, 0, 0, 0.15);
      border-left: 1px solid var(--color-border);
      border-radius: 16px 0 0 16px;
      display: flex;
      flex-direction: column;
      z-index: 1500;
      transition: right .35s ease;
      overflow: hidden;
    }

    .cart-panel.active {
      right: 0;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--gradient-primary);
      color: #fff;
    }

    .btn-close-cart {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .cart-table .row {
      display: grid;
      grid-template-columns: 1fr 90px 100px;
      align-items: center;
      border-bottom: 1px dashed var(--color-border);
      padding: 8px 0;
    }

    .empty-cart {
      text-align: center;
      color: var(--color-text-light);
      margin-top: 20px;
      display: none;
    }

    .empty-cart.active {
      display: block;
    }

    .cart-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--color-border);
      background: #fff;
    }

    .discount-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .discount-wrap input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      font-weight: 600;
    }

    .discount-wrap button {
      border: none;
      border-radius: 12px;
      background: var(--gradient-dark);
      color: #fff;
      font-weight: 800;
      padding: 10px 14px;
      cursor: pointer;
    }

    .btn-checkout {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 14px;
      background: var(--gradient-secondary);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    /* ===== BOTÓN FLOTANTE ===== */
    .floating-cart-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--gradient-primary);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 1600;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .floating-cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.25);
    }

    /* === Contador de ítems en el botón flotante === */
    .cart-count-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 22px;
      height: 22px;
      background: #f5576c;
      color: #fff;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      border: 2px solid #fff;
      transform: scale(0);
      opacity: 0;
      transition: all 0.25s ease;
    }

    /* Animación cuando hay items */
    .cart-count-badge.active {
      transform: scale(1);
      opacity: 1;
    }

    .btn-remove {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: none;
      outline: none;
      /* 🔹 elimina borde de foco */
      background: var(--gradient-secondary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s;
      font-size: 1rem;
    }

    .btn-remove:hover {
      transform: scale(1.1);
    }

    .btn-remove:focus {
      outline: none;
      /* 🔹 elimina borde azul o negro */
      box-shadow: none;
      /* 🔹 elimina sombra de enfoque */
    }



    /* ===== Responsivo ===== */
    @media (max-width: 1100px) {
      .pricing-grid {
        grid-template-columns: repeat(3, minmax(220px, 1fr));
      }
    }

    @media (max-width: 920px) {
      .pricing-grid {
        grid-template-columns: repeat(2, minmax(240px, 1fr));
      }

      .cart-panel {
        width: 100%;
        right: -100%;
        border-radius: 0;
      }

      .cart-panel.active {
        right: 0;
      }
    }

    @media (max-width: 600px) {
      .pricing-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>
