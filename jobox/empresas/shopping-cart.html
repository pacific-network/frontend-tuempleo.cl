<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes y Carrito</title>

  <!-- CSS base del proyecto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --gradient-primary:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
      --gradient-secondary:linear-gradient(135deg,#f093fb 0%,#f5576c 100%);
      --gradient-success:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
      --gradient-dark:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
      --color-primary:#667eea;--color-primary-dark:#5568d3;--color-secondary:#f5576c;
      --color-success:#00f2fe;--color-text:#2d3748;--color-text-light:#718096;
      --color-border:rgba(226,232,240,.8);--color-surface:rgba(255,255,255,.9);
      --shadow-md:0 8px 24px rgba(0,0,0,.08);--shadow-lg:0 16px 48px rgba(0,0,0,.12);--shadow-xl:0 24px 64px rgba(0,0,0,.16);
      --radius-full:9999px;--radius-lg:28px;--blur:blur(20px)
    }
    body{
      font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(102,126,234,.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(245,87,108,.06) 0%, transparent 50%),
        radial-gradient(circle at 40% 90%, rgba(74,172,254,.05) 0%, transparent 50%),
        linear-gradient(180deg,#f7fafc 0%,#edf2f7 100%);
      color:var(--color-text); min-height:100vh; padding:20px; overflow-x:hidden
    }

    /* Topbar */
    .header-container{max-width:1200px;margin:0 auto 24px;display:flex;gap:10px;align-items:center}
    .btn-back{
      display:inline-flex;align-items:center;gap:10px;padding:12px 18px;background:var(--color-surface);
      backdrop-filter:var(--blur);border:1px solid var(--color-border);border-radius:var(--radius-full);
      color:var(--color-text);font-weight:700;text-decoration:none;box-shadow:var(--shadow-md);transition:.3s
    }
    .btn-back:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);background:#fff;border-color:var(--color-primary);color:var(--color-primary)}

    /* Hero */
    .hero{text-align:center;max-width:820px;margin:0 auto 32px}
    .hero h1{
      font-size:clamp(2rem,3.5vw,3rem);font-weight:800;line-height:1.1;
      background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px
    }
    .hero p{color:var(--color-text-light);font-weight:600}

    /* ===== Contenedor de página y grilla principal ===== */
    .page-width{max-width:1320px;margin:0 auto;padding:0 16px}
    /* Grilla: [columnas de planes] | [carrito] */
    .plans-grid{
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:24px;
      align-items:start;
    }

    /* ===== Grilla de tarjetas (4 paralelas) ===== */
    .pricing-grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(220px, 1fr)); /* 4 en paralelo */
      gap:20px;
    }

    /* Card */
    .pricing-item{
      position:relative;background:var(--color-surface);backdrop-filter:var(--blur);
      border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:26px 22px;
      display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-md);transition:.3s;overflow:hidden
    }
    .pricing-item:hover{transform:translateY(-6px);box-shadow:var(--shadow-xl);border-color:transparent}
    .pricing-item.active{background:var(--gradient-primary);color:#fff;border:none;transform:scale(1.02)}
    .pricing-item.active .theme-btn{background:#fff;color:#4f5fd6}

    .pricing-popular{
      position:absolute;top:14px;right:14px;padding:6px 12px;font-size:12px;font-weight:800;border-radius:999px;
      background:#fff;color:#667eea;box-shadow:0 4px 12px rgba(0,0,0,.1)
    }
    .pricing-content h4{font-size:1.12rem;font-weight:800;margin:0}
    .pricing-amount{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px;flex-wrap:wrap}
    .price-list{position:relative;font-size:1.05rem;color:var(--color-text-light);opacity:.75}
    .price-list::after{content:'';position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:var(--gradient-secondary);transform:rotate(-8deg)}
    .price-main{font-size:clamp(1.7rem,2.4vw,2.05rem);font-weight:900;letter-spacing:-.02em}
    .currency{font-size:.9rem;color:var(--color-text-light)}
    .pricing-content p{color:var(--color-text-light);margin:0}
    .free-badge{
      display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid rgba(74,172,254,.3);
      background:linear-gradient(135deg,rgba(74,172,254,.1),rgba(0,242,254,.1));color:#0891b2;font-weight:700;margin-top:6px;font-size:.85rem
    }

    .pricing-feature ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin:0;padding:0}
    .pricing-feature li{position:relative;padding-left:26px}
    .pricing-feature li::before{
      content:'\f00c';font-family:'FontAwesome';position:absolute;left:0;top:2px;width:18px;height:18px;display:grid;place-items:center;
      border-radius:50%;background:var(--gradient-success);color:#fff;font-size:9px;box-shadow:0 3px 8px rgba(74,172,254,.3)
    }

    .theme-btn{
      width:100%;padding:12px 16px;border:none;border-radius:14px;background:var(--gradient-primary);color:#fff;
      font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(102,126,234,.3);transition:.25s
    }
    .theme-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(102,126,234,.4)}
    .theme-btn:disabled{background:linear-gradient(135deg,#cbd5e0,#a0aec0);opacity:.7;cursor:not-allowed}

    /* ===== Carrito (columna derecha) ===== */
    .cart-panel{ position:relative; }
    .cart-summary{
      position:relative;  /* en desktop NO es fixed */
      right:auto; top:auto; width:100%;
      display:none;flex-direction:column;z-index:1;
      background:var(--color-surface);backdrop-filter:var(--blur);border:1px solid var(--color-border);
      border-radius:28px;box-shadow:var(--shadow-xl);overflow:hidden
    }
    .cart-head{padding:18px;background:var(--gradient-primary);color:#fff;display:flex;align-items:center;justify-content:space-between}
    .cart-head h3{font-size:1.05rem;font-weight:900;margin:0;display:flex;gap:10px;align-items:center}
    .cart-table{padding:18px;max-height:420px;overflow-y:auto}
    .cart-table .row{display:grid;grid-template-columns:1fr 90px 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--color-border)}
    .qty{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--color-text-light)}
    .btn-remove{width:32px;height:32px;border-radius:10px;border:none;background:var(--gradient-secondary);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
    .btn-remove:hover{transform:scale(1.06)}
    .totals{padding:16px 18px;background:linear-gradient(180deg,transparent 0%, rgba(102,126,234,.05) 100%);border-top:1px solid var(--color-border)}
    .totals .line{display:flex;justify-content:space-between;padding:6px 0;font-weight:700}
    .totals .line.total{border-top:1px solid var(--color-border);margin-top:8px;padding-top:10px;font-size:1.02rem}
    .cart-footer{padding:16px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--color-border);background:#fff;flex-wrap:wrap}
    .discount-wrap{display:flex;gap:10px;align-items:stretch;flex:1 1 320px}
    .discount-wrap input{flex:1;padding:10px 12px;border:1px solid var(--color-border);border-radius:12px;background:var(--color-surface);font-weight:600}
    .discount-wrap button{padding:10px 14px;border:none;border-radius:12px;background:var(--gradient-dark);color:#fff;font-weight:800;cursor:pointer}
    .btn-checkout{width:auto;padding:11px 14px;background:var(--gradient-secondary);color:#fff;border:none;border-radius:12px;font-weight:900}
    .empty-cart{
      position:relative; right:auto; top:auto; width:100%;
      padding:24px;text-align:center;color:var(--color-text-light);
      background:var(--color-surface);backdrop-filter:var(--blur);border:1px solid var(--color-border);border-radius:28px;box-shadow:var(--shadow-lg);display:none
    }

    /* ===== Responsivo ===== */
    @media (max-width: 1280px){
      .plans-grid{ grid-template-columns: 1fr 340px; }
      .pricing-grid{ grid-template-columns: repeat(4, minmax(200px, 1fr)); }
    }
    @media (max-width: 1100px){
      .plans-grid{ grid-template-columns: 1fr 320px; }
      .pricing-grid{ grid-template-columns: repeat(3, minmax(220px, 1fr)); }
    }
    @media (max-width: 920px){
      .plans-grid{ grid-template-columns: 1fr; }
      .pricing-grid{ grid-template-columns: repeat(2, minmax(220px, 1fr)); }
      .cart-panel{ grid-column: 1 / -1; }
    }
    @media (max-width: 600px){
      .plans-grid{ grid-template-columns: 1fr; }
      .pricing-grid{ grid-template-columns: 1fr; }
      .cart-summary,.empty-cart{
        position:fixed;left:50%;right:auto;transform:translateX(-50%);
        bottom:20px;top:auto;width:min(92vw,520px);z-index:1000
      }
      .cart-head{display:none}
    }
  </style>
</head>
<body>

  <div class="preloader"><div class="loader"><span></span><span></span><span></span></div></div>

  <div class="header-container">
    <a href="employer-dashboard.html" class="btn-back" aria-label="Volver al panel">
      <i class="fa fa-arrow-left" aria-hidden="true"></i> Volver al panel
    </a>
  </div>

  <div id="header-placeholder"></div>

  <section class="hero">
    <h1>Elige tu Plan</h1>
    <p>Potencia tu reclutamiento con nuestras soluciones</p>
  </section>

  <!-- === LAYOUT: 4 planes a la izquierda + carrito a la derecha === -->
  <div class="page-width">
    <div class="plans-grid">
      <!-- Columna de planes -->
      <div>
        <div class="pricing-grid" id="planGrid"></div>
      </div>

      <!-- Carrito -->
      <aside class="cart-panel">
        <div class="cart-summary" id="cartSummary">
          <div class="cart-head"><h3><i class="fa fa-shopping-cart"></i> Tu Carrito</h3></div>
          <div class="cart-table">
            <div class="row header"><div>Producto</div><div>Cant.</div><div>Monto (CLP)</div></div>
            <div id="cartItems"></div>
          </div>
          <div class="totals">
            <div class="line"><span>Subtotal</span><strong id="cartSubtotal">$0</strong></div>
            <div class="line"><span>IVA (19%)</span><strong id="cartIva">$0</strong></div>
            <div class="line"><span>Descuento</span><strong id="cartDiscount">$0</strong></div>
            <div class="line total"><span>Total</span><strong id="cartTotal">$0</strong></div>
          </div>
          <div class="cart-footer" style="justify-content:space-between;">
            <div class="discount-wrap">
              <input id="discountCode" class="form-control" placeholder="Código de descuento" maxlength="20" />
              <button id="btnCheckCode" type="button">Validar</button>
            </div>
            <button class="btn-checkout" id="checkoutBtn"><i class="fa fa-lock"></i> Pagar Ahora</button>
          </div>
        </div>

        <p class="empty-cart" id="emptyCartMsg">
          <i class="fa fa-cart-shopping"></i> Tu carrito está vacío
        </p>
      </aside>
    </div>
  </div>

  <!-- libs -->
  <script src="../assets/js/jquery-3.6.0.min.js"></script>
  <script src="../assets/js/modernizr.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/imagesloaded.pkgd.min.js"></script>
  <script src="../assets/js/jquery.magnific-popup.min.js"></script>
  <script src="../assets/js/isotope.pkgd.min.js"></script>
  <script src="../assets/js/jquery.appear.min.js"></script>
  <script src="../assets/js/jquery.easing.min.js"></script>
  <script src="../assets/js/owl.carousel.min.js"></script>
  <script src="../assets/js/counter-up.js"></script>
  <script src="../assets/js/masonry.pkgd.min.js"></script>
  <script src="../assets/js/wow.min.js"></script>
  <script src="../assets/js/nice-select.min.js"></script>
  <script src="../assets/js/config/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/header-footer/loadHeaderFooter.js" defer></script>

  <!-- JS -->
  <script>
    const BASE_URL_API = "http://localhost:3000/v1";

    const planes = [
      { id: 1, tipoAviso: "FREE", nombre: "Publicación Gratis", precio: 0, descripcion: "Ideal para pequeñas empresas.", caracteristicas: ["Hasta 2 publicaciones", "Duración: 7 días", "Soporte básico"], popular: false },
      { id: 2, tipoAviso: "BASICO", nombre: "Publicación Básica", precio: 80000, precioLista: 100000, descripcion: "Ideal para pequeñas empresas.", caracteristicas: ["Hasta 2 publicaciones", "Duración: 7 días", "Soporte básico"], popular: false },
      { id: 3, tipoAviso: "ESTANDAR", nombre: "Publicación Estándar", precio: 140000, precioLista: 170000, descripcion: "Para empresas medianas.", caracteristicas: ["Hasta 5 publicaciones", "Duración: 30 días", "Soporte prioritario", "Reportes básicos"], popular: true },
      { id: 4, tipoAviso: "PREMIUM", nombre: "Publicación Premium", precio: 180000, precioLista: 200000, descripcion: "Para alto volumen de contratación.", caracteristicas: ["Publicaciones ilimitadas", "Duración: 60 días", "Soporte 24/7", "Consultoría avanzada"], popular: false }
    ];

    let carrito = [];

    const planGrid = document.getElementById("planGrid");
    const cartSummary = document.getElementById("cartSummary");
    const emptyCartMsg = document.getElementById("emptyCartMsg");
    const cartItemsBox = document.getElementById("cartItems");
    const elSubtotal = document.getElementById("cartSubtotal");
    const elIva = document.getElementById("cartIva");
    const elDiscount = document.getElementById("cartDiscount");
    const elTotal = document.getElementById("cartTotal");
    const checkoutBtn = document.getElementById("checkoutBtn");

    const fmtCLP = n => Number(n || 0).toLocaleString('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});

    function decodeJwt(t){try{const p=t.split('.')[1];return JSON.parse(atob(p.replace(/-/g,'+').replace(/_/g,'/')))}catch{return null}}
    function getUserIdFromToken(){const token=localStorage.getItem('token');if(!token)return null;const d=decodeJwt(token);return(d&&(d.sub||d.userId||d.id))?(d.sub||d.userId||d.id):null}

    const FREE_MONTHLY_LIMIT=3;
    function periodKey(d=new Date()){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`}
    function getFreeRemaining(){const k=`free_pub_remaining_${getUserIdFromToken()}_${periodKey()}`;const v=localStorage.getItem(k);if(v===null||isNaN(+v)){localStorage.setItem(k,String(FREE_MONTHLY_LIMIT));return FREE_MONTHLY_LIMIT}return Math.max(0,parseInt(v,10))}
    function setFreeRemaining(v){const k=`free_pub_remaining_${getUserIdFromToken()}_${periodKey()}`;localStorage.setItem(k,String(Math.max(0,v)))}

    function guardarCarrito(){localStorage.setItem('cart_items',JSON.stringify(carrito))}
    function cargarCarrito(){try{const d=JSON.parse(localStorage.getItem('cart_items')||'[]');if(Array.isArray(d))carrito=d}catch{carrito=[]}}

    function renderPlanes(){
      const freeLeft=getFreeRemaining();
      planGrid.innerHTML=planes.map(p=>{
        const isFree=p.id===1;
        const disabled=isFree&&freeLeft<=0;
        const btnText=isFree?(disabled?'Agotado este mes':'Gratis'):'Agregar al carrito';
        return `
          <div class="pricing-item ${p.popular?'active':''}">
            ${p.popular?`<div class="pricing-popular">Más popular</div>`:''}
            <div class="pricing-content">
              <h4>${p.nombre}</h4>
              <div class="pricing-amount">
                ${p.precioLista?`<span class="price-list">${fmtCLP(p.precioLista)}</span>`:''}
                <span class="price-main">${fmtCLP(p.precio)}</span> <span class="currency">CLP</span>
              </div>
              <p>${p.descripcion}</p>
              ${isFree?`<div class="free-badge"><i class="fa fa-gift"></i> Gratis disponibles: <strong>${freeLeft}/${FREE_MONTHLY_LIMIT}</strong></div>`:''}
            </div>
            <div class="pricing-feature"><ul>${p.caracteristicas.map(c=>`<li>${c}</li>`).join('')}</ul></div>
            <button class="theme-btn" data-id="${p.id}" ${disabled?'disabled':''}>${btnText}</button>
          </div>`;
      }).join('');
    }

    function calcularTotales(){
      const total=carrito.reduce((s,i)=>s+(i.precio*i.cantidad),0);
      const descuento=0;
      const subtotal=Math.round((total-descuento)/1.19);
      const iva=(total-descuento)-subtotal;
      return{subtotal,descuento,iva,total}
    }
    function renderRows(){
      cartItemsBox.innerHTML=carrito.map(i=>`
        <div class="row">
          <div>${i.nombre}</div>
          <div class="qty"><span>x${i.cantidad}</span><button class="btn-remove" data-id="${i.id}">🗑️</button></div>
          <div>${fmtCLP(i.precio*i.cantidad)}</div>
        </div>`).join('');
    }
    function renderCarrito(){
      if(carrito.length===0){
        cartSummary.style.display="none";
        emptyCartMsg.style.display="block";
      }else{
        cartSummary.style.display="flex";
        emptyCartMsg.style.display="none";
        renderRows();
        const {subtotal,descuento,iva,total}=calcularTotales();
        elSubtotal.textContent=fmtCLP(subtotal);
        elIva.textContent=fmtCLP(iva);
        elDiscount.textContent=fmtCLP(descuento);
        elTotal.textContent=fmtCLP(total);
      }
    }

    function agregarAlCarrito(id){
      const plan=planes.find(p=>p.id===id);if(!plan)return;
      if(plan.id===1){
        const freeLeft=getFreeRemaining();
        if(freeLeft<=0){alert('Ya usaste tus 3 publicaciones gratis este mes.');return}
      }
      const ex=carrito.find(p=>p.id===id);
      if(ex) ex.cantidad++; else carrito.push({...plan,cantidad:1});
      guardarCarrito();renderCarrito();alert(`"${plan.nombre}" agregado al carrito.`);
    }

    document.addEventListener("click",e=>{
      const rm=e.target.closest(".btn-remove");
      if(rm){const id=parseInt(rm.dataset.id);carrito=carrito.filter(i=>i.id!==id);guardarCarrito();renderCarrito();return}
      const add=e.target.closest(".theme-btn");
      if(add && !add.disabled){agregarAlCarrito(parseInt(add.dataset.id))}
    });

    async function getEmpresaId(userId,token){
      const res=await fetch(`${BASE_URL_API}/empleador/basic-info/${userId}`,{headers:{Authorization:`Bearer ${token}`}}); 
      if(!res.ok) throw new Error('No se pudo obtener la empresa del empleador.');
      const data=await res.json(); localStorage.setItem('empresaId',data.empresa_id); return data.empresa_id;
    }
    async function createPendingTransaction(empresaId,items,token){
      const res=await fetch(`${BASE_URL_API}/webpay/create-pending`,{
        method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({empresaId,items})
      });
      const j=await res.json(); if(!res.ok) throw new Error(j?.message||'No se pudo registrar la transacción.'); return j;
    }
    async function startWebpayTransaction(orderId,amount,token){
      const res=await fetch(`${BASE_URL_API}/webpay/create`,{
        method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
        body:JSON.stringify({orderId,amount})
      });
      const j=await res.json(); if(!res.ok) throw new Error(j?.message||'No se pudo iniciar Webpay.'); return j;
    }

    checkoutBtn.addEventListener('click', async ()=>{
      const { total } = calcularTotales();
      const token = localStorage.getItem('token');
      if(!token) return alert('Debes iniciar sesión para continuar.');

      const userId = getUserIdFromToken();
      let empresaId = localStorage.getItem('empresaId');
      if(!empresaId){ try{ empresaId = await getEmpresaId(userId, token);}catch{ return alert('No se pudo obtener la empresa asociada.'); } }

      if(total===0){
        const freeItem=carrito.find(i=>i.id===1);
        const freeLeft=getFreeRemaining();
        if(!freeItem || freeItem.cantidad>freeLeft) return alert('No puedes usar más publicaciones gratis.');
        setFreeRemaining(freeLeft - freeItem.cantidad);
        carrito=[]; guardarCarrito(); renderCarrito(); renderPlanes();
        alert('✅ Publicación gratuita activada.'); 
        return window.location.href='employer-post-job.html';
      }
      try{
        const paidItems=carrito.filter(i=>i.precio>0).map(i=>({tipoAviso:i.tipoAviso,cantidad:i.cantidad,precioUnitario:i.precio}));
        const pending=await createPendingTransaction(empresaId,paidItems,token);
        const webpay=await startWebpayTransaction(pending.orderId,pending.total,token);
        if(webpay.url && webpay.token){
          const form=document.createElement('form'); form.method='POST'; form.action=webpay.url;
          const inp=document.createElement('input'); inp.type='hidden'; inp.name='token_ws'; inp.value=webpay.token;
          form.appendChild(inp); document.body.appendChild(form); form.submit();
        }else alert('Error al iniciar el proceso de pago.');
      }catch(err){ console.error(err); alert(err.message || 'Ocurrió un error al procesar el pago.'); }
    });

    document.addEventListener('DOMContentLoaded', ()=>{
      cargarCarrito();renderPlanes();renderCarrito();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    (function(){ if(!window.Swal) return; const n=window.alert.bind(window);
      window.alert=function(msg){ try{Swal.fire({toast:true,icon:'success',title:typeof msg==='string'?msg:JSON.stringify(msg),position:'top-end',showConfirmButton:false,timer:1500,timerProgressBar:true});}catch{n(msg);} };
    })();
  </script>

</body>
</html>
