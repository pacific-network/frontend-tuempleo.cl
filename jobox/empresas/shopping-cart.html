<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planes y Carrito</title>

  <!-- Fuentes / CSS base del proyecto -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/font-awesome.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />

  <!-- ===== UI más grande + estética (ancho más estrecho) ===== -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-dark: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      --color-primary: #667eea;
      --color-primary-dark: #5568d3;
      --color-secondary: #f5576c;
      --color-success: #00f2fe;
      --color-text: #2d3748;
      --color-text-light: #718096;
      --color-border: rgba(226, 232, 240, .8);
      --color-surface: rgba(255, 255, 255, .9);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, .08);
      --shadow-lg: 0 18px 52px rgba(0, 0, 0, .12);
      --shadow-xl: 0 28px 70px rgba(0, 0, 0, .16);
      --radius-full: 9999px;
      --radius-lg: 32px;
      --blur: blur(20px)
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
      background:
        radial-gradient(circle at 20% 10%, rgba(102, 126, 234, .08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(245, 87, 108, .06) 0%, transparent 50%),
        radial-gradient(circle at 40% 90%, rgba(74, 172, 254, .05) 0%, transparent 50%),
        linear-gradient(180deg, #f7fafc 0%, #edf2f7 100%);
      color: var(--color-text);
      min-height: 100vh;
      padding: 28px;
      overflow-x: hidden
    }

    /* Topbar (estrechado) */
    .header-container {
      max-width: 1100px;
      /* antes 1320px */
      margin: 0 auto 28px;
      display: flex;
      gap: 12px;
      align-items: center
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: var(--color-surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      color: var(--color-text);
      font-weight: 800;
      text-decoration: none;
      box-shadow: var(--shadow-md);
      transition: .3s;
      font-size: 1.05rem
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      background: #fff;
      border-color: var(--color-primary);
      color: var(--color-primary)
    }

    /* Hero (más contenido, menos ancho) */
    .hero {
      text-align: center;
      max-width: 760px;
      margin: 0 auto 36px
    }

    /* antes 920px */
    .hero h1 {
      font-size: clamp(2.2rem, 4.2vw, 3.2rem);
      font-weight: 900;
      line-height: 1.08;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px
    }

    .hero p {
      color: var(--color-text-light);
      font-weight: 600;
      font-size: clamp(1rem, 1.2vw, 1.08rem)
    }

    /* Layout principal (estrechado) */
    .page-width {
      max-width: 1100px;
      /* antes 1440px */
      margin: 0 auto;
      padding: 0 20px
    }

    .plans-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      /* antes 420px */
      gap: 24px;
      /* un pelito menos gap */
      align-items: start
    }

    /* Cards de planes (4 en paralelo) */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(240px, 1fr));
      gap: 20px
    }

    /* minmax levemente menor */
    .pricing-item {
      position: relative;
      background: var(--color-surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 30px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-md);
      transition: .3s;
      overflow: hidden
    }

    .pricing-item:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
      border-color: transparent
    }

    .pricing-item.active {
      background: var(--gradient-primary);
      color: #fff;
      border: none;
      transform: scale(1.02)
    }

    .pricing-item.active .theme-btn {
      background: #fff;
      color: #4f5fd6
    }

    .pricing-popular {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 7px 12px;
      font-size: .78rem;
      font-weight: 900;
      border-radius: 999px;
      background: #fff;
      color: #667eea;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .12)
    }

    .pricing-content h4 {
      font-size: 1.18rem;
      font-weight: 900;
      margin: 0
    }

    .pricing-amount {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 8px 0 6px;
      flex-wrap: wrap
    }

    .price-list {
      position: relative;
      font-size: 1.02rem;
      color: var(--color-text-light);
      opacity: .75
    }

    .price-list::after {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;
      height: 2px;
      background: var(--gradient-secondary);
      transform: rotate(-8deg)
    }

    .price-main {
      font-size: clamp(1.8rem, 2.4vw, 2.1rem);
      font-weight: 900;
      letter-spacing: -.02em
    }

    .currency {
      font-size: .95rem;
      color: var(--color-text-light)
    }

    .pricing-content p {
      color: #eaf0ff;
      opacity: .95
    }

    .pricing-item:not(.active) .pricing-content p {
      color: var(--color-text-light)
    }

    .free-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(74, 172, 254, .3);
      background: linear-gradient(135deg, rgba(74, 172, 254, .1), rgba(0, 242, 254, .1));
      color: #0891b2;
      font-weight: 800;
      margin-top: 8px;
      font-size: .9rem
    }

    .pricing-feature ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0;
      padding: 0
    }

    .pricing-feature li {
      position: relative;
      padding-left: 28px;
      font-size: 1.01rem
    }

    .pricing-feature li::before {
      content: '\f00c';
      font-family: 'FontAwesome';
      position: absolute;
      left: 0;
      top: 2px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--gradient-success);
      color: #fff;
      font-size: 10px;
      box-shadow: 0 3px 8px rgba(74, 172, 254, .3)
    }

    /* Botón centrado */
    .theme-btn {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: none;
      border-radius: 16px;
      background: var(--gradient-primary);
      color: #fff;
      font-weight: 900;
      font-size: 1rem;
      line-height: 1;
      box-shadow: 0 10px 28px rgba(102, 126, 234, .32);
      cursor: pointer;
      transition: .25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(102, 126, 234, .4)
    }

    .theme-btn:disabled {
      background: linear-gradient(135deg, #cbd5e0, #a0aec0);
      opacity: .7;
      cursor: not-allowed
    }

    .theme-btn i {
      line-height: 0;
      margin-right: .5rem
    }

    /* Carrito (columna derecha) */
    .cart-summary {
      position: relative;
      right: auto;
      top: auto;
      width: 100%;
      display: none;
      flex-direction: column;
      z-index: 1;
      background: var(--color-surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--color-border);
      border-radius: 28px;
      box-shadow: var(--shadow-xl);
      overflow: hidden
    }

    .cart-head {
      padding: 18px;
      background: var(--gradient-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .cart-head h3 {
      font-size: 1.08rem;
      font-weight: 900;
      margin: 0;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .cart-table {
      padding: 18px;
      max-height: 440px;
      overflow-y: auto;
      font-size: 1.01rem
    }

    .cart-table .row {
      display: grid;
      grid-template-columns: 1fr 90px 120px;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--color-border)
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      color: var(--color-text-light)
    }

    .btn-remove {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: none;
      background: var(--gradient-secondary);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .2s
    }

    .btn-remove:hover {
      transform: scale(1.06)
    }

    .totals {
      padding: 16px 18px;
      background: linear-gradient(180deg, transparent 0%, rgba(102, 126, 234, .05) 100%);
      border-top: 1px solid var(--color-border)
    }

    .totals .line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-weight: 800
    }

    .totals .line.total {
      border-top: 1px solid var(--color-border);
      margin-top: 8px;
      padding-top: 10px;
      font-size: 1.05rem
    }

    .cart-footer {
      padding: 16px 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--color-border);
      background: #fff;
      flex-wrap: wrap
    }

    .discount-wrap {
      display: flex;
      gap: 10px;
      align-items: stretch;
      flex: 1 1 320px
    }

    .discount-wrap input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      background: var(--color-surface);
      font-weight: 700
    }

    .discount-wrap button {
      padding: 12px 14px;
      border: none;
      border-radius: 14px;
      background: var(--gradient-dark);
      color: #fff;
      font-weight: 900;
      cursor: pointer
    }

    .btn-checkout {
      width: auto;
      padding: 12px 14px;
      background: var(--gradient-secondary);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 900
    }

    .empty-cart {
      position: relative;
      right: auto;
      top: auto;
      width: 100%;
      padding: 24px;
      text-align: center;
      color: var(--color-text-light);
      background: var(--color-surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--color-border);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      display: none;
      font-size: 1.03rem
    }

    /* Responsive */
    @media (max-width: 1280px) {
      .plans-grid {
        grid-template-columns: 1fr 320px;
      }

      .pricing-grid {
        grid-template-columns: repeat(4, minmax(220px, 1fr));
      }
    }

    @media (max-width: 1100px) {
      .plans-grid {
        grid-template-columns: 1fr 300px;
      }

      .pricing-grid {
        grid-template-columns: repeat(3, minmax(220px, 1fr));
      }
    }

    @media (max-width: 920px) {
      .plans-grid {
        grid-template-columns: 1fr;
      }

      .pricing-grid {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .cart-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 600px) {
      .plans-grid {
        grid-template-columns: 1fr;
      }

      .pricing-grid {
        grid-template-columns: 1fr;
      }

      .cart-summary,
      .empty-cart {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 20px;
        width: min(92vw, 560px);
        z-index: 1000
      }

      .cart-head {
        display: none
      }
    }
  </style>
</head>

<body>

  <div class="preloader">
    <div class="loader"><span></span><span></span><span></span></div>
  </div>

  <!-- Back button superior -->
  <div class="header-container">
    <a href="employer-dashboard.html" class="btn-back" aria-label="Volver al panel">
      <i class="fa fa-arrow-left" aria-hidden="true"></i> Volver al panel
    </a>
  </div>

  <div id="header-placeholder"></div>

  <section class="hero">
    <h1>Elige tu Aviso</h1>
    <p>Potencia tu reclutamiento con nuestras soluciones</p>
  </section>

  <!-- === LAYOUT: 4 planes a la izquierda + carrito a la derecha === -->
  <div class="page-width">
    <div class="plans-grid">
      <!-- Columna de planes -->
      <div>
        <div class="pricing-grid" id="planGrid"></div>
      </div>

      <!-- Carrito -->
      <aside class="cart-panel">
        <div class="cart-summary" id="cartSummary">
          <div class="cart-head">
            <h3><i class="fa fa-shopping-cart"></i> Tu Carrito</h3>
          </div>
          <div class="cart-table">
            <div class="row header">
              <div>Producto</div>
              <div>Cant.</div>
              <div>Monto (CLP)</div>
            </div>
            <div id="cartItems"></div>
          </div>
          <div class="totals">
            <div class="line"><span>Subtotal</span><strong id="cartSubtotal">$0</strong></div>
            <div class="line"><span>IVA (19%)</span><strong id="cartIva">$0</strong></div>
            <div class="line"><span>Descuento</span><strong id="cartDiscount">$0</strong></div>
            <div class="line total"><span>Total</span><strong id="cartTotal">$0</strong></div>
          </div>
          <div class="cart-footer" style="justify-content:space-between;">
            <div class="discount-wrap">
              <input id="discountCode" class="form-control" placeholder="Código de descuento" maxlength="20" />
              <button id="btnCheckCode" type="button">Validar</button>
            </div>
            <button class="btn-checkout" id="checkoutBtn"><i class="fa fa-lock"></i> Ir al Pago</button>
          </div>
        </div>

        <p class="empty-cart" id="emptyCartMsg">
          <i class="fa fa-cart-shopping"></i> Tu carrito está vacío
        </p>
      </aside>
    </div>
  </div>

  <!-- libs -->
  <script src="../assets/js/jquery-3.6.0.min.js"></script>
  <script src="../assets/js/modernizr.min.js"></script>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/imagesloaded.pkgd.min.js"></script>
  <script src="../assets/js/jquery.magnific-popup.min.js"></script>
  <script src="../assets/js/isotope.pkgd.min.js"></script>
  <script src="../assets/js/jquery.appear.min.js"></script>
  <script src="../assets/js/jquery.easing.min.js"></script>
  <script src="../assets/js/owl.carousel.min.js"></script>
  <script src="../assets/js/counter-up.js"></script>
  <script src="../assets/js/masonry.pkgd.min.js"></script>
  <script src="../assets/js/wow.min.js"></script>
  <script src="../assets/js/nice-select.min.js"></script>
  <script src="../assets/js/config/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/header-footer/loadHeaderFooter.js" defer></script>
  <script src="../assets/js/modules/transacciones/shopping-cart.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>



</body>

</html>
